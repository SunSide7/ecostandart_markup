ологические угрозы для своего здоровья и самочувствия близких.</span></label></form></div><div class="card-neutral-white card-img-bg"><div class="img"><img src="img/sections/legend_70/img-bg.png" alt=""/></div></div><div class="card-neutral-white card-icon-notice nobsp-mr-0 nobsp-mb-0"><div class="img"><img src="img/sections/legend_70/icon.svg"/></div><div class="flex"><h2 class="h-2 title-life w-90p nobsp-mb-20 nobsp-d-flex-md-col nobsp-d-flex-lg-col h-sm-3"><span>Результат:</span> <span><span id="health-check-form-result">0</span> балла</span></h2><p class="h-4 color-black nobsp-mb-0 nobsp-p-0">вредные соединения уже оказывают влияние на ваш организм.</p></div></div></div></div></section><!--include ../sections/legend_75--><!--include ../sections/legend_76--><!--include ../sections/legend_82--><!--include ../sections/legend_83--><!--include ../sections/legend_84--><!--include ../sections/legend_85--><!--include ../sections/legend_89--><!--include ../sections/legend_90--><!--include ../sections/legend_91--><!--include ../sections/legend_92--><!-- img/assets/icons/medium/arrow_up_grey.svg--><!-- img/assets/dev/1000.svg--><!-- img/assets/icons/ultimate/icon_white.svg-->
